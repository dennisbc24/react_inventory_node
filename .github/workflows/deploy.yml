name: Deploy backend to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          password: ${{ secrets.DEPLOY_SSH_PASSWORD }}
          script: |
            set -e
            export NVM_DIR="$HOME/.nvm"
            . "$NVM_DIR/nvm.sh"
            cd ${{ secrets.DEPLOY_PATH }}
            echo "==> Git fetch + reset --hard (sobrescribe cambios locales/untracked)"
            git fetch origin main
            git reset --hard origin/main
            git clean -fd
            echo "==> Install & migrate"
            npm ci
            NODE_ENV=production node migrations/run.js 005_invoices.sql
            NODE_ENV=production node migrations/run.js 006_forecasting.sql
            NODE_ENV=production node migrations/run.js 007_products_discontinued.sql
            echo "==> Entrenar modelo de forecasting (obligatorio para el snapshot)"
            # La instancia de EC2 limita el heap de Node a ~230 MB: con 730 días y
            # 60k filas el entrenamiento moría por OOM. Estas cotas entran holgadas
            # y el artefacto resultante sigue siendo válido para inferencia.
            NODE_ENV=production node scripts/train_forecasting_model.js --history-days 365 --max-training-rows 20000 --estimators 20 || echo "WARN: el entrenamiento fallo"
            if [ ! -s services/forecasting/artifacts/gbm_quantiles.json ]; then
              echo "ERROR: falta services/forecasting/artifacts/gbm_quantiles.json"
              echo "ERROR: sin artefacto el calculo entrena en caliente y vuelve el 502. Deploy abortado."
              exit 1
            fi
            ls -lh services/forecasting/artifacts/gbm_quantiles.json
            echo "==> Restart"
            pm2 restart inventariojs || pm2 start server.js --name inventariojs
            pm2 save
            pm2 ls
            echo "==> Deploy OK $(date) $(git rev-parse --short HEAD)"